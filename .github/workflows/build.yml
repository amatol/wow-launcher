name: Build Dreamworld Windows and macOS

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate icon
        run: python generate_icon.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Dreamworld.exe
        run: pyinstaller Dreamworld.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dreamworld-exe
          path: dist/Dreamworld.exe

      - name: Delete previous build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const previousBuilds = artifacts.filter(artifact =>
              artifact.name === 'Dreamworld-exe' &&
              artifact.workflow_run?.id !== context.runId
            );

            for (const artifact of previousBuilds) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Dreamworld.app with Wine
        run: tools/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dreamworld-macos
          path: dist/Dreamworld.app.zip
