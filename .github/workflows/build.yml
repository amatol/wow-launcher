name: Build Dreamworld Windows and macOS

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Windows release
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate icon
        run: python generate_icon.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Dreamworld.exe
        run: pyinstaller Dreamworld.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dreamworld-exe
          path: dist/Dreamworld.exe

      - name: Delete previous build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const previousBuilds = artifacts.filter(artifact =>
              artifact.name === 'Dreamworld-exe' &&
              artifact.workflow_run?.id !== context.runId
            );

            for (const artifact of previousBuilds) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

  build-macos:
    name: macOS release
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache-winecx
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Identify macOS build platform
        id: macos-platform
        run: |
          test "$(uname -m)" = arm64
          echo "version=$(sw_vers -productVersion | cut -d. -f1)" >> "$GITHUB_OUTPUT"
      - name: Install launcher dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Cache compiled CrossOver Wine
        id: winecx-cache
        uses: actions/cache@v4
        with:
          path: |
            build/winecx-runtime.tar.gz
            build/winecx-probe.exe
          key: winecx-26.3.0-${{ runner.os }}-${{ runner.arch }}-macos${{ steps.macos-platform.outputs.version }}-rosetta-bottles-v2-${{ hashFiles('tools/build_winecx.sh', 'tools/install_winecx_dependencies.sh', 'tools/install_winecx_bottles.py', 'tools/winecx-homebrew-lock.json', 'tools/bundle_winecx_libraries.py', 'tools/winecx-lock.json', 'tools/winecx_probe.c', 'tools/patches/*.patch') }}
      - name: Restore compiler cache
        if: steps.winecx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache-winecx
          key: winecx-objects-26.3.0-${{ runner.os }}-${{ runner.arch }}-macos${{ steps.macos-platform.outputs.version }}-rosetta-bottles-v2-${{ github.run_id }}
          restore-keys: winecx-objects-26.3.0-${{ runner.os }}-${{ runner.arch }}-macos${{ steps.macos-platform.outputs.version }}-rosetta-bottles-v2-
      - name: Cache pinned Wine dependency bottles
        if: steps.winecx-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: build/winecx-bottles
          key: winecx-bottles-x86_64-${{ hashFiles('tools/winecx-homebrew-lock.json') }}
      - name: Install Wine build dependencies
        timeout-minutes: 15
        if: steps.winecx-cache.outputs.cache-hit != 'true'
        run: bash tools/install_winecx_dependencies.sh
      - name: Build CrossOver 26.3 Wine from source
        timeout-minutes: 85
        if: steps.winecx-cache.outputs.cache-hit != 'true'
        run: |
          arch -x86_64 /bin/bash -c 'export PATH="/usr/local/bin:/usr/local/sbin:$PATH"; exec /bin/bash tools/build_winecx.sh'
      - name: Save compiler cache, including failed builds
        if: always() && steps.winecx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache-winecx
          key: winecx-objects-26.3.0-${{ runner.os }}-${{ runner.arch }}-macos${{ steps.macos-platform.outputs.version }}-rosetta-bottles-v2-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: WineCX-runtime
          path: |
            build/winecx-runtime.tar.gz
            build/winecx-probe.exe
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WineCX-build-diagnostics
          path: build/winecx-objects/config.log

      - name: Unpack CrossOver Wine runtime
        run: |
          mkdir -p build/winecx
          tar -xf build/winecx-runtime.tar.gz -C build/winecx
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Dreamworld.app with Wine
        timeout-minutes: 12
        run: tools/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dreamworld-macos
          path: dist/Dreamworld.app.zip
