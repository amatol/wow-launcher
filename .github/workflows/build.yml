name: Build Dreamworld Windows and macOS

permissions:
  contents: read
  actions: write

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate icon
        run: python generate_icon.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Dreamworld.exe
        run: pyinstaller Dreamworld.spec --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dreamworld-exe
          path: dist/Dreamworld.exe

      - name: Delete previous build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const previousBuilds = artifacts.filter(artifact =>
              artifact.name === 'Dreamworld-exe' &&
              artifact.workflow_run?.id !== context.runId
            );

            for (const artifact of previousBuilds) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }

  build-winecx:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache compiled CrossOver Wine
        id: winecx-cache
        uses: actions/cache@v4
        with:
          path: |
            build/winecx-runtime.tar.gz
            build/winecx-probe.exe
          key: winecx-26.3.0-macos15-${{ hashFiles('tools/build_winecx.sh', 'tools/bundle_winecx_libraries.py', 'tools/winecx-lock.json', 'tools/winecx_probe.c') }}
      - name: Build CrossOver 26.3 Wine from source
        if: steps.winecx-cache.outputs.cache-hit != 'true'
        run: |
          brew install bison mingw-w64 pkgconf freetype gnutls
          bash tools/build_winecx.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WineCX-runtime
          path: |
            build/winecx-runtime.tar.gz
            build/winecx-probe.exe
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WineCX-build-diagnostics
          path: build/winecx-objects/config.log

  build-macos:
    needs: build-winecx
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - uses: actions/download-artifact@v4
        with:
          name: WineCX-runtime
          path: build
      - name: Unpack CrossOver Wine runtime
        run: |
          mkdir -p build/winecx
          tar -xf build/winecx-runtime.tar.gz -C build/winecx
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build Dreamworld.app with Wine
        timeout-minutes: 12
        run: tools/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dreamworld-macos
          path: dist/Dreamworld.app.zip
