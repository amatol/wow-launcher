name: Verify Survivors first install from Yandex

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP dependency
        run: python -m pip install requests
      - name: Download archive and verify all installed files
        run: python tools/verify_survivors_yandex.py "${{ runner.temp }}/survivors-yandex-install"
      - uses: actions/upload-artifact@v4
        with:
          name: Survivors-yandex-verification
          path: survivors-yandex-verification.json
